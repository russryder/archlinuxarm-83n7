    {
      "id": "sspm-override",
      "type": "custom",
      "repo_url": null,
      "checkout_hash": null,
      "sparse": {
        "enabled": false,
        "paths": []
      },
      "code": "provenance/hardware/acpi_builder.py",
      "dependencies": [
        {
          "name": "python",
          "version": "3.14.8-1",
          "version_status": "pinned",
          "source": "locks/live-tools.json"
        }
      ],
      "inputs": [],
      "output": "assets/hardware/acpi/h7607a-acpi.cpio",
      "notes": [
        "Enable NVDA8400 SSPM without a global OSI override.",
        "SSPM._STA is found by walking the AML to the Device holding _HID NVDA8400; offsets are not pinned.",
        "SVP0, HFRP (DSDT) and NH1X, NMAP (SSDT CB-01) carry the same Windows 2022 gate and stay hidden.",
        "No SSDT is overridden: the Lenovo LfcECCom EC methods already keep FF-A buffers in named objects.",
        "Apply early ACPI archive in RAM; do not flash firmware.",
        "power-archive-builder.py --dump DIR copies the SDCN77WW DSDT from the owner's dump to the baseline path and writes the archive, each once its pinned hash matches; sspm-builder.py checks without writing.",
        "The firmware table and the archive are not stored in this repository. Redistribution permission is not asserted."
      ]
    },
    {
      "id": "acpi-table-dump-kit",
      "type": "custom",
      "repo_url": null,
      "checkout_hash": null,
      "sparse": {
        "enabled": false,
        "paths": []
      },
      "code": "scripts/stage-acpi-dump.py",
      "dependencies": [
        {
          "name": "python",
          "version": "3.14.8-1",
          "version_status": "pinned",
          "source": "locks/live-tools.json"
        }
      ],
      "inputs": [
        "assets/hardware/uefi/Shell.efi",
        "assets/hardware/uefi/acpi-dump.nsh"
      ],
      "notes": [
        "Copy the media component's pinned EDK2 Shell to EFI/BOOT/BOOTAA64.EFI and acpi-dump.nsh to EFI/BOOT/startup.nsh on a mounted FAT32 stick; nothing is partitioned or formatted.",
        "Booting the stick runs acpiview -s DSDT -d and acpiview -s SSDT -d in its H7607A-ACPI folder after removing old dumps, because acpiview does not truncate existing files."
      ]
    }
  ],
