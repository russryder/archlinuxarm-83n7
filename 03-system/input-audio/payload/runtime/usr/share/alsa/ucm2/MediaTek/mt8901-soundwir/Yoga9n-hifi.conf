#
# Lenovo Yoga 9 2-in-1 16N1X11 (83N7): CS42L43 + four CS35L56 amps
# (l1u0, l1u1, l1u4, l1u5), all on SoundWire link 1.
#
# Adapted from NVIDIA's HiFi-cs42l43-cs35l56x4.conf, alsa-ucm-conf pull
# request 862, commit 7d3555a754936ce073ce5fe3d623294d81dd5c66.
#
# Supersedes Yoga9n-playback.conf, which was the same adaptation with the
# capture path removed. The playback sections here are byte-for-byte the ones
# proven working on this machine; only capture is new.
#
#   Speaker     PCM0  (DL0)
#   Headphones  PCM1  (DL1)
#   Mic/Headset PCM8  (UL1)
#
# PCM8 is correct for this card: the machine driver's mt8901_fe_dais[] is
# DL0,DL1,DL2,DL3,DL4,DL5,DL_24CH,UL0,UL1,... so UL1 is index 8, which agrees
# with upstream's `hw:${CardId},8` and with DL0=0 / DL1=1 used for playback.
#
# Capture requires the ALSA input nodes to be enabled in WirePlumber; see
# ../../../../wireplumber/wireplumber.conf.d/51-h7607a-playback.conf.
#
# NOT YET VERIFIED ON HARDWARE. Written from the Windows side on 2026-11-21.
# The two values most likely to need correction are the exact control names
# and the capture PCM index. Confirm with:
#   amixer -c 0 controls | grep -iE 'PDI13|O020|O021|Decimator|Headset Mic'
#   arecord -l
#
# Deliberately follows commit 7d3555a, not the PR HEAD (c22cf4c). HEAD adds
#   CaptureMixer     "default:${CardId}"
#   CaptureMixerElem "cs42l43 Microphone"          (in Mic)
#   CaptureMixerElem "cs42l43 Headset Microphone"  (in Headset)
# and drops the Decimator/Headset Mic Switch lines. Those mixer elements give
# PipeWire a volume control, but a name that does not exist on this card makes
# the whole device fail to apply. Add them once both are confirmed present,
# and prefer HEAD if upstream merges it.

SectionVerb {
    EnableSequence [
        cset "name='AMP1 Speaker Switch' 0"
        cset "name='AMP2 Speaker Switch' 0"
        cset "name='AMP3 Speaker Switch' 0"
        cset "name='AMP4 Speaker Switch' 0"
        cset "name='Speaker Switch' 0"
        cset "name='Headphone Switch' 0"
        # speakers: DL0 -> O152/O153 -> PDI3 -> DP3 -> SDW1_Playback1
        cset "name='O152 I032 Switch' 1"
        cset "name='O153 I033 Switch' 1"
        cset "name='PDI3 Demux' DP3"
        # jack: DL1 -> O156/O157 -> PDI5 -> DP5
        cset "name='O156 I034 Switch' 1"
        cset "name='O157 I035 Switch' 1"
        cset "name='PDI5 Demux' DP5"
        cset "name='PDI6 Demux' DP6"
        cset "name='cs42l43 Headphone L Input 1' DP5RX1"
        cset "name='cs42l43 Headphone R Input 1' DP5RX2"
        # capture: UL1 <- O020/O021 <- PDI13 <- host DP7
        cset "name='PDI13 Mux' DP7"
        cset "name='O020 I180 Switch' 1"
        cset "name='O021 I181 Switch' 1"
    ]
    DisableSequence [
        cset "name='AMP1 Speaker Switch' 0"
        cset "name='AMP2 Speaker Switch' 0"
        cset "name='AMP3 Speaker Switch' 0"
        cset "name='AMP4 Speaker Switch' 0"
        cset "name='Speaker Switch' 0"
        cset "name='Headphone Switch' 0"
        cset "name='O020 I180 Switch' 0"
        cset "name='O021 I181 Switch' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Internal speakers"
    EnableSequence [
        cset "name='Speaker Switch' 1"
        cset "name='AMP1 Speaker Switch' 1"
        cset "name='AMP2 Speaker Switch' 1"
        cset "name='AMP3 Speaker Switch' 1"
        cset "name='AMP4 Speaker Switch' 1"
    ]
    DisableSequence [
        cset "name='AMP1 Speaker Switch' 0"
        cset "name='AMP2 Speaker Switch' 0"
        cset "name='AMP3 Speaker Switch' 0"
        cset "name='AMP4 Speaker Switch' 0"
        cset "name='Speaker Switch' 0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
}

SectionDevice."Headphones" {
    Comment "Wired headphones"
    EnableSequence [
        cset "name='Headphone Switch' 1"
        cset "name='cs42l43 Headphone Digital Volume' 229,229"
    ]
    DisableSequence [ cset "name='Headphone Switch' 0" ]
    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},1"
        PlaybackChannels 2
        PlaybackMixerElem "cs42l43 Headphone Digital"
        JackControl "Headphone Jack"
        JackHWMute "Speaker"
    }
}

SectionDevice."Mic" {
    Comment "Internal microphone array"
    ConflictingDevice [ "Headset" ]
    EnableSequence [
        cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
        cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
        cset "name='cs42l43 Decimator 3 Switch' 1"
        cset "name='cs42l43 Decimator 4 Switch' 1"
        cset "name='cs42l43 Decimator 3 Volume' 176"
        cset "name='cs42l43 Decimator 4 Volume' 176"
    ]
    DisableSequence [
        cset "name='cs42l43 Decimator 3 Switch' 0"
        cset "name='cs42l43 Decimator 4 Switch' 0"
        # hand the shared DP1TX inputs back to the Headset device
        cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
        cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},8"
        CaptureChannels 2
    }
}

SectionDevice."Headset" {
    Comment "Headset microphone (jack)"
    ConflictingDevice [ "Mic" ]
    EnableSequence [
        cset "name='Headset Mic Switch' 1"
        cset "name='cs42l43 Decimator 1 Mode' ADC"
        cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
        cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
        cset "name='cs42l43 Decimator 1 Switch' 1"
    ]
    DisableSequence [
        cset "name='cs42l43 Decimator 1 Switch' 0"
        cset "name='Headset Mic Switch' 0"
        cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
        cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
    ]
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},8"
        CaptureChannels 2
        JackControl "Headset Mic Jack"
    }
}
