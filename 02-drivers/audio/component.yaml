        }
      ],
      "source_build_note": "provenance/hardware/audio-build.sh rebuilds the module from audio-source.c with the inputs recorded in audio-build.json, checks its imports against the stock module of the pinned kernel plus dmi_match, and compares it with the shipped binary. Reversing the identity patch on audio-source.c gives the pinned NV-Kernels file."
    },
    {
      "id": "cirrus-oem-tuning",
      "type": "direct",
      "repo_url": null,
      "checkout_hash": null,
      "sparse": {
        "enabled": false,
        "paths": []
      },
      "source_url": null,
      "version": "Lenovo/Cirrus XuCsMeExt_3802_FDL 1.1.0.11; WMFW 3.13.5",
      "notes": [
        "No public download of the Lenovo package is pinned. scripts/stage-lenovo-tuning.py copies the eight tuning files and the WMFW from the owner's own Windows driver store under their Linux names, after checking each against its pin.",
        "Names use SSID 17aa3802 and amps l1u0, l1u1, l1u4, l1u5; SS0/SS1 become spkid0/spkid1, and the plain names without spkid come from SS0 because the firmware declares no speaker-ID GPIO.",
        "The installer copies them from the installer tree into /usr/lib/firmware/cirrus/; see locks/hardware.json.",
        "The files are not stored in this repository. Redistribution permission is not asserted."
      ],
      "code": "scripts/stage-lenovo-tuning.py"
    }
  ],
